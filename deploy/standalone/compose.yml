name: orangemoon-canvas

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    shm_size: 128m
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.50
    pids_limit: 192
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    logging: *default-logging

  platform-migrate:
    image: orangemoon/platform-migrate:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 768m
    cpus: 2.00
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  platform-api:
    image: orangemoon/platform-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_OPTIONS: --max-old-space-size=768
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      PLATFORM_PORT: 17400
      PLATFORM_BODY_LIMIT_MB: ${PLATFORM_BODY_LIMIT_MB:-64}
      PLATFORM_MAX_CONCURRENT_GENERATIONS: ${PLATFORM_MAX_CONCURRENT_GENERATIONS:-5}
      PLATFORM_ALLOWED_ORIGINS: ${PLATFORM_ALLOWED_ORIGINS:?PLATFORM_ALLOWED_ORIGINS is required}
      PLATFORM_COOKIE_SECURE: "true"
      PLATFORM_ALLOW_FIRST_USER_ADMIN: "false"
      PLATFORM_SESSION_DAYS: ${PLATFORM_SESSION_DAYS:-30}
      PLATFORM_IP_HASH_SALT: ${PLATFORM_IP_HASH_SALT:?PLATFORM_IP_HASH_SALT is required}
      MANUAL_ALIPAY_ENABLED: ${MANUAL_ALIPAY_ENABLED:-true}
      MANUAL_ALIPAY_PAYEE: ${MANUAL_ALIPAY_PAYEE:-橙月画布}
      MANUAL_ALIPAY_QR_URL: ${MANUAL_ALIPAY_QR_URL:-}
      MANUAL_ALIPAY_INSTRUCTIONS: ${MANUAL_ALIPAY_INSTRUCTIONS:-}
      MANUAL_WECHAT_ENABLED: ${MANUAL_WECHAT_ENABLED:-true}
      MANUAL_WECHAT_PAYEE: ${MANUAL_WECHAT_PAYEE:-橙月画布}
      MANUAL_WECHAT_QR_URL: ${MANUAL_WECHAT_QR_URL:-}
      MANUAL_WECHAT_INSTRUCTIONS: ${MANUAL_WECHAT_INSTRUCTIONS:-}
      METAJING_API_KEY: ${METAJING_API_KEY:-}
      MINIMAX_AUDIO_API_KEY: ${MINIMAX_AUDIO_API_KEY:-}
      MINIMAX_DEFAULT_VOICE_ID: ${MINIMAX_DEFAULT_VOICE_ID:-}
      PLATFORM_METAJING_USD_TO_CNY: ${PLATFORM_METAJING_USD_TO_CNY:-1.0}
      PLATFORM_MINIMAX_USD_TO_CNY: ${PLATFORM_MINIMAX_USD_TO_CNY:-7.3}
      PLATFORM_PRICE_MARKUP: ${PLATFORM_PRICE_MARKUP:-1.65}
      PLATFORM_AGENT_INPUT_CREDITS_PER_MILLION: ${PLATFORM_AGENT_INPUT_CREDITS_PER_MILLION:-18.563}
      PLATFORM_AGENT_CACHED_INPUT_CREDITS_PER_MILLION: ${PLATFORM_AGENT_CACHED_INPUT_CREDITS_PER_MILLION:-1.857}
      PLATFORM_AGENT_OUTPUT_CREDITS_PER_MILLION: ${PLATFORM_AGENT_OUTPUT_CREDITS_PER_MILLION:-111.375}
      PLATFORM_AGENT_RESERVE_CREDITS: ${PLATFORM_AGENT_RESERVE_CREDITS:-2}
      CANVAS_AGENT_INTERNAL_SECRET: ${CANVAS_AGENT_INTERNAL_SECRET:?CANVAS_AGENT_INTERNAL_SECRET is required}
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - egress
    mem_limit: 1280m
    mem_reservation: 256m
    cpus: 2.50
    pids_limit: 384
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:17400/platform-api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging: *default-logging

  canvas-agent:
    image: orangemoon/canvas-agent:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      CANVAS_AGENT_MODE: cloud
      CANVAS_AGENT_HOST: 0.0.0.0
      PORT: 17371
      PLATFORM_API_INTERNAL_URL: http://platform-api:17400/platform-api
      CANVAS_AGENT_INTERNAL_SECRET: ${CANVAS_AGENT_INTERNAL_SECRET:?CANVAS_AGENT_INTERNAL_SECRET is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?OPENAI_BASE_URL is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-high}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-6000}
      CANVAS_AGENT_MAX_CONCURRENT: ${CANVAS_AGENT_MAX_CONCURRENT:-5}
      CANVAS_AGENT_BODY_LIMIT: ${CANVAS_AGENT_BODY_LIMIT:-60mb}
    depends_on:
      platform-api:
        condition: service_healthy
    networks:
      - backend
      - egress
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 2.00
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:17371/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: *default-logging

  app:
    image: orangemoon/canvas:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-64m}
      CANVAS_AGENT_URL: /canvas-agent
      CANVAS_AGENT_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
    depends_on:
      platform-api:
        condition: service_healthy
      canvas-agent:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "127.0.0.1:${APP_PORT:-4320}:3000"
    mem_limit: 192m
    mem_reservation: 32m
    cpus: 0.75
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging

volumes:
  postgres-data:
    name: orangemoon-canvas-postgres

networks:
  backend:
    name: orangemoon-canvas-backend
    internal: true
  egress:
    name: orangemoon-canvas-egress
    driver: bridge
