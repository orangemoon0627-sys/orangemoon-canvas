services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orangemoon}
      POSTGRES_USER: ${POSTGRES_USER:-orangemoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    volumes:
      - orangemoon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orangemoon} -d ${POSTGRES_DB:-orangemoon}"]
      interval: 5s
      timeout: 3s
      retries: 30

  platform-migrate:
    build:
      context: ./platform-api
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orangemoon}:${POSTGRES_PASSWORD:-change-me-before-production}@postgres:5432/${POSTGRES_DB:-orangemoon}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform-api:
    build:
      context: ./platform-api
      dockerfile: Dockerfile
    image: orangemoon/platform-api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orangemoon}:${POSTGRES_PASSWORD:-change-me-before-production}@postgres:5432/${POSTGRES_DB:-orangemoon}?schema=public
      PLATFORM_PORT: 17400
      PLATFORM_BODY_LIMIT_MB: ${PLATFORM_BODY_LIMIT_MB:-128}
      PLATFORM_MEDIA_MAX_FILE_MB: ${PLATFORM_MEDIA_MAX_FILE_MB:-64}
      PLATFORM_MEDIA_DIR: /var/lib/orangemoon/media
      PLATFORM_MAX_CONCURRENT_GENERATIONS: ${PLATFORM_MAX_CONCURRENT_GENERATIONS:-4}
      VIDEO_RECONCILE_INTERVAL_MS: ${VIDEO_RECONCILE_INTERVAL_MS:-10000}
      VIDEO_RECONCILE_CONCURRENCY: ${VIDEO_RECONCILE_CONCURRENCY:-4}
      PLATFORM_ALLOWED_ORIGINS: ${PLATFORM_ALLOWED_ORIGINS:-http://localhost:3000}
      PLATFORM_COOKIE_SECURE: ${PLATFORM_COOKIE_SECURE:-false}
      PLATFORM_ALLOW_FIRST_USER_ADMIN: ${PLATFORM_ALLOW_FIRST_USER_ADMIN:-false}
      PLATFORM_SESSION_DAYS: ${PLATFORM_SESSION_DAYS:-30}
      PLATFORM_IP_HASH_SALT: ${PLATFORM_IP_HASH_SALT:-change-me-before-production}
      MANUAL_ALIPAY_ENABLED: ${MANUAL_ALIPAY_ENABLED:-false}
      MANUAL_ALIPAY_PAYEE: ${MANUAL_ALIPAY_PAYEE:-橙月画布}
      MANUAL_ALIPAY_QR_URL: ${MANUAL_ALIPAY_QR_URL:-}
      MANUAL_ALIPAY_INSTRUCTIONS: ${MANUAL_ALIPAY_INSTRUCTIONS:-}
      MANUAL_WECHAT_ENABLED: ${MANUAL_WECHAT_ENABLED:-false}
      MANUAL_WECHAT_PAYEE: ${MANUAL_WECHAT_PAYEE:-橙月画布}
      MANUAL_WECHAT_QR_URL: ${MANUAL_WECHAT_QR_URL:-}
      MANUAL_WECHAT_INSTRUCTIONS: ${MANUAL_WECHAT_INSTRUCTIONS:-}
      METAJING_API_KEY: ${METAJING_API_KEY:-}
      MINIMAX_AUDIO_API_KEY: ${MINIMAX_AUDIO_API_KEY:-}
      MINIMAX_DEFAULT_VOICE_ID: ${MINIMAX_DEFAULT_VOICE_ID:-}
      PLATFORM_METAJING_USD_TO_CNY: ${PLATFORM_METAJING_USD_TO_CNY:-1.0}
      PLATFORM_MINIMAX_USD_TO_CNY: ${PLATFORM_MINIMAX_USD_TO_CNY:-7.3}
      PLATFORM_PRICE_MARKUP: ${PLATFORM_PRICE_MARKUP:-1.65}
      PLATFORM_AGENT_INPUT_CREDITS_PER_MILLION: ${PLATFORM_AGENT_INPUT_CREDITS_PER_MILLION:-18.563}
      PLATFORM_AGENT_CACHED_INPUT_CREDITS_PER_MILLION: ${PLATFORM_AGENT_CACHED_INPUT_CREDITS_PER_MILLION:-1.857}
      PLATFORM_AGENT_OUTPUT_CREDITS_PER_MILLION: ${PLATFORM_AGENT_OUTPUT_CREDITS_PER_MILLION:-111.375}
      PLATFORM_AGENT_RESERVE_CREDITS: ${PLATFORM_AGENT_RESERVE_CREDITS:-2}
      CANVAS_AGENT_INTERNAL_SECRET: ${CANVAS_AGENT_INTERNAL_SECRET:-orangemoon-local-agent-billing-secret}
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
    volumes:
      - orangemoon-media:/var/lib/orangemoon/media
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:17400/platform-api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  canvas-agent:
    build:
      context: ./canvas-agent
      dockerfile: Dockerfile
    image: orangemoon/canvas-agent:local
    restart: unless-stopped
    environment:
      CANVAS_AGENT_MODE: cloud
      CANVAS_AGENT_HOST: 0.0.0.0
      PORT: 17371
      PLATFORM_API_INTERNAL_URL: http://platform-api:17400/platform-api
      CANVAS_AGENT_INTERNAL_SECRET: ${CANVAS_AGENT_INTERNAL_SECRET:-orangemoon-local-agent-billing-secret}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-high}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-6000}
      CANVAS_AGENT_MAX_CONCURRENT: ${CANVAS_AGENT_MAX_CONCURRENT:-2}
      CANVAS_AGENT_BODY_LIMIT: ${CANVAS_AGENT_BODY_LIMIT:-30mb}
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:17371/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: orangemoon/canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    depends_on:
      platform-api:
        condition: service_healthy
      canvas-agent:
        condition: service_healthy
    restart: unless-stopped
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-128m}
      CANVAS_AGENT_URL: /canvas-agent
      CANVAS_AGENT_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
    # 统计分析（可选，默认关闭）。每家一个独立变量，填了谁就启用谁，可同时启用多家：
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX                    # Google Analytics 4 衡量 ID
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # 百度统计站点 ID

volumes:
  orangemoon-postgres:
  orangemoon-media:
